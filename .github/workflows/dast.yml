name: dast

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan"
        required: false
        default: "http://localhost:3000"
  schedule:
    # Weekly, after the security workflow.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start the production server
        # The baseline must run against a PRODUCTION build. The dev server
        # relaxes the CSP with 'unsafe-eval' for Turbopack HMR, which would
        # make the scan report a finding that does not exist in production.
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ github.event.inputs.target_url || 'http://localhost:3000' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json

  local-baseline:
    name: local passive baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000
      # Implements the same ZAP passive rule IDs without needing a container,
      # so the check still runs where Docker is unavailable.
      - run: node scripts/dast-baseline.mjs http://localhost:3000
