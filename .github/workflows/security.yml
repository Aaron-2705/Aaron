name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed advisory in an unchanged dependency is still
    # surfaced. Most supply-chain findings arrive without a commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks must see the whole history, not just the tip: a secret that
          # was committed and later deleted is still leaked.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fallback scanner (also runs locally where gitleaks is absent)
        run: node scripts/secret-scan.mjs

  dependencies:
    name: dependency and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        # --omit dev: the dev toolchain never reaches a visitor. Dev-only
        # findings are triaged in docs/security/, not used to fail the build.
        run: npm audit --omit dev --audit-level high
      - name: Regenerate the SBOM and fail if it drifted
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > /tmp/sbom.json
          node -e "
            const a = require('./docs/security/sbom.cdx.json').components.map(c => c.purl).sort();
            const b = require('/tmp/sbom.json').components.map(c => c.purl).sort();
            if (JSON.stringify(a) !== JSON.stringify(b)) {
              console.error('SBOM is stale. Run: npm sbom --sbom-format cyclonedx --omit dev > docs/security/sbom.cdx.json');
              process.exit(1);
            }
            console.log('SBOM matches the lockfile:', b.length, 'components');
          "
      - name: Dependency confusion
        # Every declared dependency must resolve on the public registry. A name
        # that does not is one an attacker could claim.
        run: node scripts/dependency-confusion.mjs

  build:
    name: typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
